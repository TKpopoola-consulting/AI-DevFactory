# frontend/pubspec.yaml
name: ai_devfactory
description: AI DevFactory - Transform ideas into production-ready code
version: 2.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  animations: ^2.0.7
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.3
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  
  # Code Display
  flutter_highlight: ^0.7.0
  syntax_highlighter: ^1.0.0
  markdown: ^7.2.1
  
  # Charts & Graphs
  fl_chart: ^0.66.0
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.1
  file_picker: ^6.1.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
  
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
